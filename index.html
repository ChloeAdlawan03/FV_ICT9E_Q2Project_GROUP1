  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <h1 class="text-center" style="color:rgb(255, 255, 255)"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRpZJc41KxHTCtiacsXkLOzS_QO9tMggilUH9PPeXFahg&s=10" class="margin-left rounded-circle" style="height: 40px; width: 40px">OBMC Enrollment Form</h1>
        <p class="text-center" style="color:rgb(255, 255, 255)">Fill out the form below to enroll!</p>
      </div>
      <br>

      <div class="row justify-content-center">
        <div class="col-lg-8 rounded-3" style="background-color: rgb(234, 244, 253, 0.6); box-shadow: 0 1px 10px rgb(104, 104, 104)">
          
          <div class="row">
            <form action="">
              <br>
              <h4>Student Information</h4>
              <div class="row">
                <div class="col">
                  <label for="name" class="form-label">First name</label>
                  <br>
                  <input type="name" class="form-control" required>
                </div>

                <div class="col">
                  <label for="name" class="form-label">Last name</label>
                  <br>
                  <input type="name" class="form-control" required>
                  <br>
                </div>
                </div>

                <label for="birthdate" class="form-label">Birth date</label>
                <br>
                <input type="date" class="form-control" required>
                <br>


                <div class="row">
                  <div class="col">
                    <label for="Gender" class="form-label">Gender</label>
                      <br>
                      <select id="gender" name="gender">
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                        <option value="other">Other</option>
                      </select>
                  </div>
                
                  <div class="col">
                    <label for="gradelevel" class="form-label">Grade Level</label>
                      <br>
                      <select id="gradelevel" name="gradelevel">
                        <option value="casa">Casa</option>
                        <option value="primary">Primary</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="highschool">Highschool</option>
                      </select>
                       <br><br>
                  </div>


              <h4>Contact Details</h4>
                
                <div class="row">
                  <div class="col">
                    <label for="email" class="form-label">Email</label>
                    <br>
                    <input type="email" class="form-control" required placeholder="name@gmail.com">
                    <br>
                  </div>

                  <div class="col">
                    <label for="number" class="form-label">Contact Number</label>
                    <br>
                    <input type="number" class="form-control" required placeholder="0123-456-7890">
                    <br>
                  </div>
                </div>


              <h4>Other Information</h4>
                <div class="col">
                  <h6>Mode of Learning</h6>
                    <input type="radio" required>
                    <label for="online" class="form-label">Online</label>
                    <br>
                  </div>
                  
                  <div class="col">
                    <input type="radio" required>
                    <label for="F2F" class="form-label">Face-to-Face</label>
                    <br>
                  </div>

                  <div class="col">
                    <input type="radio" required>
                    <label for="confirm" class="form-label">I confirm that the information provided is true and complete.</label>
                    <br>
                  </div>
                
                <button type="button" class="btn btn-warning mb-5 rounded-2">Submit Enrollment</button>

            </form>
          </div>
          
        </div>
      </div>
      
    </div>
  </div>
